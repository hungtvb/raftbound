name: RAFTFORGE A14 Costume Factory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/raftforge/character_lab/**'
      - 'tools/raftforge/tests/test_character_lab.py'
      - '.github/workflows/character-costume-a14.yml'
  push:
    paths:
      - 'tools/raftforge/character_lab/**'
      - 'tools/raftforge/tests/test_character_lab.py'
      - '.github/workflows/character-costume-a14.yml'
jobs:
  generate-costume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender and headless rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb xauth libgl1-mesa-dri libegl1
          python -m pip install numpy scipy trimesh pillow vtk
      - name: Verify Blender bundled Python dependencies
        run: |
          /usr/bin/python3 -c 'import numpy; print("system numpy:",numpy.__version__)'
          blender -b --python-expr 'import numpy; print("Blender numpy:", numpy.__version__)'
      - name: Fetch pinned CC0 base and verify checksum
        run: |
          mkdir -p qa-character-a14
          curl -fL --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/programasweights/avatar/ddd5fc34a445bcded3cf9836607aaeebc19a5c78/public/assets/character.glb \
            -o qa-character-a14/base.glb
          echo 'd6f3b64cab629f6ddca9ba063811aeffd3663a8a4e49ade47cd9505dc2bbd70f  qa-character-a14/base.glb' | sha256sum --check
      - name: Generate actual skinned costume GLB
        run: |
          xvfb-run -a blender -b --python tools/raftforge/character_lab/costume_factory.py -- \
            --input qa-character-a14/base.glb \
            --output qa-character-a14/sailor-costume-candidate.glb \
            --report qa-character-a14/generation.json
      - name: Require nonempty Blender export
        run: test -s qa-character-a14/sailor-costume-candidate.glb
      - name: Audit GLB, preserve rig and generate real multiview comparison
        env:
          PYTHONPATH: tools/raftforge
        run: |
          python -m character_lab audit qa-character-a14/sailor-costume-candidate.glb --report qa-character-a14/audit.json
          # The source base faces +Z; RAFTBOUND gameplay characters face -Z.
          # Both GLBs must use identical orientation and scale before comparison.
          python -m character_lab fit qa-character-a14/base.glb \
            --out qa-character-a14/base-game-oriented.glb --height 1.8 --yaw 180
          python -m character_lab fit qa-character-a14/sailor-costume-candidate.glb \
            --out qa-character-a14/sailor-costume-game-oriented.glb --height 1.8 --yaw 180
          python -m character_lab audit qa-character-a14/sailor-costume-game-oriented.glb \
            --report qa-character-a14/game-oriented-audit.json
          xvfb-run -a python -m character_lab compare qa-character-a14/sailor-costume-game-oriented.glb \
            --reference qa-character-a14/base-game-oriented.glb --out qa-character-a14/base-vs-costume.png
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('qa-character-a14/generation.json').read_text())
          dst=json.loads(Path('qa-character-a14/audit.json').read_text())
          assert src['armatures']>=1 and any(g['created'] for g in src['garments'])
          assert dst['technical_pass'] and dst['skins']>=1 and dst['bones']>=30
          print('A14 structural GLB and rig acceptance PASS; ART QUALITY NOT YET APPROVED')
          PY
      - name: Regression test glTF PBR and vertex color composition
        env:
          PYTHONPATH: tools/raftforge
        run: |
          xvfb-run -a python -m unittest discover -s tools/raftforge/tests -p test_character_lab.py -v
          # The costume must be visibly blue/brown in QA pixels, not white.
          xvfb-run -a python - <<'PY'
          from character_lab.preview import render_glb
          import numpy as np
          from PIL import Image
          model='qa-character-a14/sailor-costume-game-oriented.glb'
          image=np.asarray(render_glb(model,angle='front',size=(550,640))).astype(np.int16)
          # Distinct fabric hues under the preview lights.
          r,g,b = image[:,:,0],image[:,:,1],image[:,:,2]
          saturated_blue=(b>r*1.28)&(g>r*1.18)&(b>75)&(g>65)
          # Under physical lights the shaded trousers are typically RGB ~50/39/25.
          # Avoid a bright-only predicate that incorrectly rejects real dark fabric.
          warm_brown=(r>g*1.10)&(g>b*1.06)&(r>35)
          blue_fraction=float(np.mean(saturated_blue))
          brown_fraction=float(np.mean(warm_brown))
          print('A14 fabric-visible fractions:', blue_fraction,brown_fraction)
          assert blue_fraction>0.0006,('vest material invisible',blue_fraction)
          assert brown_fraction>0.002,('trouser/boot material invisible',brown_fraction)
          Image.fromarray(image.astype('uint8')).save('qa-character-a14/sailor-single-view.png')
          PY
      - name: Verify garment geometry is visibly separated from body
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import trimesh
          from scipy.spatial import cKDTree
          from pathlib import Path
          scene=trimesh.load('qa-character-a14/sailor-costume-candidate.glb',force='scene')
          body_tf,body_geo=scene.graph['SuperHero_Male']
          body=trimesh.transform_points(scene.geometry[body_geo].vertices,body_tf)
          tree=cKDTree(body)
          results={}
          for name in ['RB_SailorVest','RB_CanvasPants','RB_LeatherBoots']:
              tf,geo=scene.graph[name]
              points=trimesh.transform_points(scene.geometry[geo].vertices,tf)
              distances,_=tree.query(points)
              median=float(np.median(distances))
              visibly_offset=float(np.mean(distances>0.004))
              results[name]={'median_distance_m':round(median,5),
                  'fraction_gt_4mm':round(visibly_offset,4),'vertices':len(points)}
              assert visibly_offset>.75 and median>.006,(name,results[name])
          Path('qa-character-a14/garment-surface-offset.json').write_text(json.dumps(results,indent=2))
          print('Garment rest-pose clearance CHECK PASS',results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raftforge-a14-real-costume-evidence
          path: qa-character-a14/
          retention-days: 30
