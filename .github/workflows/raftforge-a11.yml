name: RAFTFORGE A11 - Local 3D Assets
on:
  push:
    paths:
      - 'tools/raftforge/**'
      - '.github/workflows/raftforge-a11.yml'
  pull_request:
    paths:
      - 'tools/raftforge/**'
      - '.github/workflows/raftforge-a11.yml'
jobs:
  procedural-glb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/raftforge/requirements.txt
      - name: Install open-source dependencies
        run: python -m pip install -r tools/raftforge/requirements.txt
      - name: Run deterministic export/validation tests
        working-directory: tools/raftforge
        run: python -m unittest discover -s tests -v
      - name: Build GLB artifacts and PBR map files
        working-directory: tools/raftforge
        run: python -m raftforge batch --out output
      - name: Validate all outputs present
        working-directory: tools/raftforge
        run: |
          test -s output/foundation_2m_art.glb
          test -s output/storage_chest_art.glb
          test -s output/compact_grill_art.glb
          test -s output/qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: raftforge-a11-glb-assets
          path: |
            tools/raftforge/output/*.glb
            tools/raftforge/output/qa.json
            tools/raftforge/output/textures/*.png
