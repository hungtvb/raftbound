<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RAFTBOUND — GLB Asset Inspector</title>
<style>*{box-sizing:border-box}body{margin:0;background:#081a23;color:#e6f3ef;font:14px system-ui,sans-serif}#top{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;background:#102c37;border-bottom:1px solid #41636c}h1{font-size:20px;letter-spacing:2px;margin:0;color:#e9ba72}main{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 62px)}aside{background:#10232b;padding:20px;overflow:auto}#nav{display:flex;flex-direction:column;gap:5px;margin-top:16px}button{font:inherit;color:#d5e9e3;background:#1b3a44;border:1px solid #2a525b;cursor:pointer;padding:12px 15px;text-align:left;border-radius:8px}button:hover,button.on{background:#315d61;color:white}section{position:relative;min-height:400px}canvas{display:block}#details{position:absolute;left:28px;bottom:24px;background:#091b23d9;padding:16px 20px;border-radius:12px;max-width:400px}#details h2{margin:0 0 5px;font-size:21px}#hint{font-size:12px;color:#b8cac4}#status{color:#aac8c3}a{color:#edd097}@media(max-width:750px){main{grid-template-columns:1fr;grid-template-rows:175px 1fr}aside{padding:10px;overflow:auto}#nav{flex-direction:row;flex-wrap:wrap}button{padding:8px}#details{left:12px;right:12px;bottom:12px}#top{padding:12px}h1{font-size:16px}}</style>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/"}}</script></head>
<body><header id="top"><h1>RAFTBOUND / 3D ASSET LAB</h1><span id="status">Đang tải dữ liệu…</span></header>
<main><aside><b>ASSET LIBRARY A01</b><p style="color:#92b1ae">Chọn để xem model 3D, xoay và phóng to.</p><div id="nav"></div><p><small>GLB: local · Renderer: Three.js CDN</small></p></aside><section id="viewport"><div id="details"><h2 id="name">Model</h2><p id="desc"></p><div id="stats"></div><p id="hint">Kéo để xoay · Cuộn để zoom · Chuột phải để pan</p></div></section></main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const viewport=document.getElementById('viewport'),status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;viewport.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#bad5d3');scene.fog=new THREE.Fog('#bad5d3',23,55);
const camera=new THREE.PerspectiveCamera(40,1,.03,80);camera.position.set(3.6,2.8,4.6);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.4,0);
scene.add(new THREE.HemisphereLight('#efffff','#b6a48b',2.1));
const sun=new THREE.DirectionalLight('#fff1d9',3.4);sun.position.set(-2,6,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=7;sun.shadow.camera.bottom=-7;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:'#91babb',roughness:.93}));floor.rotation.x=-Math.PI/2;floor.position.y=-.35;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(12,12,'#83b3b1','#a3c5c1');grid.position.y=-.345;grid.material.opacity=.25;grid.material.transparent=true;scene.add(grid);
const loader=new GLTFLoader();let current=null,data=null;
function resize(){const rect=viewport.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(viewport);
async function choose(item){
 status.textContent=`Đang mở ${item.id}…`;
 document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.asset===item.id));
 try{const gltf=await loader.loadAsync('../'+item.file);if(current)scene.remove(current);current=gltf.scene;
 current.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material.side=THREE.DoubleSide}});scene.add(current);
 const bounds=new THREE.Box3().setFromObject(current);const center=bounds.getCenter(new THREE.Vector3());const size=bounds.getSize(new THREE.Vector3());
 current.position.sub(center);current.position.y+=size.y*.5-.30;
 const max=Math.max(size.x,size.y,size.z);controls.target.set(0,Math.max(.2,size.y*.5-.27),0);
 camera.position.set(Math.max(2.1,max*1.9),Math.max(1.6,max*1.5),Math.max(2.5,max*2.1));controls.update();
 document.getElementById('name').textContent=item.id.replaceAll('_',' ').toUpperCase();document.getElementById('desc').textContent=item.description_vi;
 document.getElementById('stats').textContent=`${item.triangles.toLocaleString('vi-VN')} triangles · ${item.materials} materials · ${item.size_kb} KB`;
 status.textContent='Ready · GLB loaded';
 }catch(e){console.error(e);status.textContent='Lỗi tải GLB: '+e.message}
}
async function init(){try{const res=await fetch('../asset_manifest.json');data=await res.json();for(const item of data.assets){const b=document.createElement('button');b.textContent=item.id.replaceAll('_',' ');b.dataset.asset=item.id;b.onclick=()=>choose(item);document.getElementById('nav').appendChild(b)}choose(data.assets[0])}catch(e){status.textContent='Không tải được manifest: '+e.message}}
function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}resize();tick();init();
</script></body></html>
